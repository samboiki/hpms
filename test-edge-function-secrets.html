<!DOCTYPE html>
<html>
<head>
    <title>Test Edge Function Secrets</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 4px; }
        button { padding: 10px 20px; margin: 10px 0; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🔧 Test Edge Function Secrets</h1>
    <p>This will test if the Gmail secrets are properly configured in your edge function.</p>
    
    <button onclick="testSecrets()">Test Secrets Configuration</button>
    <div id="result"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Initialize Supabase client
        const supabaseUrl = 'https://jjxlfunlbyayxwvlpgwt.supabase.co';
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpqeGxmdW5sYnlheXh3dmxwZ3d0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MTU3NzY4NTQsImV4cCI6MjAzMTM1Mjg1NH0.KDe8_bQVGKoahcb7CRrl5_n6K-6lV7LmdEWLX8JJPH8';
        
        const { createClient } = supabase;
        const supabaseClient = createClient(supabaseUrl, supabaseAnonKey);

        async function testSecrets() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p class="info">🔄 Testing edge function secrets...</p>';
            
            try {
                console.log('🚀 Testing edge function with batch ID...');
                
                const { data, error } = await supabaseClient.functions.invoke('send-batch-email', {
                    body: { batch_id: '782752c0-cb09-4c11-b43a-0365c2a0d152' }
                });

                if (error) {
                    console.error('❌ Edge function error:', error);
                    
                    // Analyze the error to provide specific guidance
                    let analysis = '';
                    const errorMessage = error.message || JSON.stringify(error);
                    
                    if (errorMessage.includes('Missing required environment variables')) {
                        analysis = `
                        <h3 class="error">❌ Secrets Not Configured</h3>
                        <p>The Gmail secrets are missing. Please follow these steps:</p>
                        <ol>
                            <li>Go to <a href="https://supabase.com/dashboard/project/jjxlfunlbyayxwvlpgwt/settings/functions" target="_blank">Supabase Edge Functions Settings</a></li>
                            <li>Scroll down to the <strong>Secrets</strong> section</li>
                            <li>Add these secrets:
                                <ul>
                                    <li><code>GMAIL_ADDRESS</code> = your-practice@gmail.com</li>
                                    <li><code>GMAIL_APP_PASSWORD</code> = your-16-character-app-password</li>
                                </ul>
                            </li>
                            <li>Redeploy the edge function</li>
                        </ol>
                        `;
                    } else if (errorMessage.includes('Invalid credentials') || errorMessage.includes('SMTP')) {
                        analysis = `
                        <h3 class="error">❌ Gmail Authentication Issue</h3>
                        <p>Secrets are set but Gmail authentication is failing:</p>
                        <ul>
                            <li>Ensure you're using a Gmail <strong>App Password</strong> (not regular password)</li>
                            <li>Enable 2-Factor Authentication on your Gmail account</li>
                            <li>Remove any spaces from the App Password</li>
                            <li>Use a business Gmail account if possible</li>
                        </ul>
                        `;
                    } else if (errorMessage.includes('function prepare_batch_for_sending')) {
                        analysis = `
                        <h3 class="error">❌ Database Function Missing</h3>
                        <p>The database function is not created. Run the database setup SQL in Supabase SQL Editor.</p>
                        `;
                    } else if (errorMessage.includes('No recipient email')) {
                        analysis = `
                        <h3 class="error">❌ Medical Aid Email Missing</h3>
                        <p>The medical aid provider email is not configured in the database.</p>
                        `;
                    } else {
                        analysis = `
                        <h3 class="error">❌ Unknown Error</h3>
                        <p>An unexpected error occurred. Check the edge function logs for more details.</p>
                        `;
                    }
                    
                    resultDiv.innerHTML = `
                        ${analysis}
                        <h4>Full Error Details:</h4>
                        <pre>${JSON.stringify(error, null, 2)}</pre>
                    `;
                } else {
                    console.log('✅ Success:', data);
                    resultDiv.innerHTML = `
                        <h3 class="success">✅ Edge Function Working!</h3>
                        <p>The edge function executed successfully. Email should be sent.</p>
                        <h4>Response:</h4>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                console.error('💥 Exception:', error);
                resultDiv.innerHTML = `
                    <h3 class="error">💥 Network Error</h3>
                    <p>Failed to call the edge function. Check your internet connection.</p>
                    <pre>${error.message}</pre>
                `;
            }
        }
    </script>
</body>
</html>
