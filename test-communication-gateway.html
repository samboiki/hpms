<!DOCTYPE html>
<html>
<head>
    <title>Test Communication Gateway</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .test-section { border: 1px solid #ddd; padding: 20px; border-radius: 8px; }
        pre { background: #f0f0f0; padding: 10px; overflow-x: auto; font-size: 12px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 10px 0; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        h2 { margin-top: 0; }
        .header { text-align: center; margin-bottom: 30px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>HPMS Communication Gateway Test</h1>
        <p>Test the centralized SMS and Email gateways</p>
    </div>

    <div class="container">
        <div class="test-section">
            <h2>📱 SMS Gateway Test</h2>
            <p>Send test SMS to: <strong>+264812222331</strong></p>
            <button onclick="testSMS()">Send Test SMS</button>
            <div id="smsResult"></div>
        </div>

        <div class="test-section">
            <h2>📧 Email Gateway Test</h2>
            <p>Send test email to: <strong>ksnahol@gmail.com</strong></p>
            <button onclick="testEmail()">Send Test Email</button>
            <div id="emailResult"></div>
        </div>
    </div>

    <div style="margin-top: 30px; text-align: center;">
        <button onclick="testBoth()">🚀 Send Both SMS & Email</button>
    </div>

    <script>
        const practiceId = '5da3896d-b9f3-4b0a-996a-3adca867cb30';

        async function testSMS() {
            const resultDiv = document.getElementById('smsResult');
            resultDiv.innerHTML = '<p class="info">⏳ Sending SMS...</p>';
            
            try {
                const response = await fetch('https://jjxlfunlbyayxwvlpgwt.supabase.co/functions/v1/centralized-sms-gateway', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-application-name': 'hpms-test'
                    },
                    body: JSON.stringify({
                        practiceId: practiceId,
                        recipientPhone: '+264812222331',
                        messageContent: 'HPMS Gateway Test SMS\nTime: ' + new Date().toLocaleString() + '\nStatus: Centralized gateway working ✓',
                        messageType: 'test',
                        metadata: {
                            test: true,
                            timestamp: new Date().toISOString()
                        }
                    })
                });
                
                const result = await response.json();
                
                if (response.ok && result.success) {
                    resultDiv.innerHTML = `
                        <h3 class="success">✅ SMS Sent Successfully!</h3>
                        <p><strong>Log ID:</strong> ${result.logId}</p>
                        <p><strong>Message ID:</strong> ${result.messageId}</p>
                        <p><strong>Status:</strong> ${result.status}</p>
                        <p><strong>Remaining Credits:</strong> ${result.remainingCredits}</p>
                        <details>
                            <summary>Full Response</summary>
                            <pre>${JSON.stringify(result, null, 2)}</pre>
                        </details>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <h3 class="error">❌ SMS Send Failed</h3>
                        <p><strong>Status:</strong> ${response.status}</p>
                        <p><strong>Error:</strong> ${result.error}</p>
                        <details>
                            <summary>Full Response</summary>
                            <pre>${JSON.stringify(result, null, 2)}</pre>
                        </details>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <h3 class="error">❌ Network Error</h3>
                    <p>${error.message}</p>
                `;
            }
        }

        async function testEmail() {
            const resultDiv = document.getElementById('emailResult');
            resultDiv.innerHTML = '<p class="info">⏳ Sending Email...</p>';
            
            try {
                const response = await fetch('https://jjxlfunlbyayxwvlpgwt.supabase.co/functions/v1/centralized-email-gateway', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-application-name': 'hpms-test'
                    },
                    body: JSON.stringify({
                        practiceId: practiceId,
                        recipientEmail: 'ksnahol@gmail.com',
                        recipientName: 'Test User',
                        subject: 'HPMS Gateway Test Email - ' + new Date().toLocaleTimeString(),
                        htmlContent: `
                            <div style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto;">
                                <h2 style="color: #333;">HPMS Centralized Email Gateway Test</h2>
                                <p>This is a test email from the HPMS centralized communication gateway.</p>
                                
                                <div style="background: #f0f0f0; padding: 15px; border-radius: 5px; margin: 20px 0;">
                                    <p><strong>Test Details:</strong></p>
                                    <ul>
                                        <li>Time: ${new Date().toLocaleString()}</li>
                                        <li>Practice ID: ${practiceId}</li>
                                        <li>Gateway: Centralized Email Gateway</li>
                                        <li>Provider: Resend</li>
                                    </ul>
                                </div>
                                
                                <p style="color: #28a745;"><strong>✓ If you received this email, the centralized email gateway is working correctly!</strong></p>
                                
                                <hr style="border: 1px solid #eee; margin: 30px 0;">
                                
                                <p style="color: #666; font-size: 12px;">
                                    This is an automated test email from HPMS Healthcare Practice Management System.
                                    <br>Please do not reply to this email.
                                </p>
                            </div>
                        `,
                        textContent: 'HPMS Centralized Email Gateway Test\n\nThis is a test email from the HPMS centralized communication gateway.\n\nTest Details:\n- Time: ' + new Date().toLocaleString() + '\n- Practice ID: ' + practiceId + '\n- Gateway: Centralized Email Gateway\n- Provider: Resend\n\n✓ If you received this email, the centralized email gateway is working correctly!\n\nThis is an automated test email from HPMS Healthcare Practice Management System.',
                        emailType: 'test',
                        metadata: {
                            test: true,
                            timestamp: new Date().toISOString()
                        }
                    })
                });
                
                const result = await response.json();
                
                if (response.ok && result.success) {
                    resultDiv.innerHTML = `
                        <h3 class="success">✅ Email Sent Successfully!</h3>
                        <p><strong>Log ID:</strong> ${result.logId}</p>
                        <p><strong>Message ID:</strong> ${result.messageId}</p>
                        <p><strong>Status:</strong> ${result.status}</p>
                        <details>
                            <summary>Full Response</summary>
                            <pre>${JSON.stringify(result, null, 2)}</pre>
                        </details>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <h3 class="error">❌ Email Send Failed</h3>
                        <p><strong>Status:</strong> ${response.status}</p>
                        <p><strong>Error:</strong> ${result.error}</p>
                        <details>
                            <summary>Full Response</summary>
                            <pre>${JSON.stringify(result, null, 2)}</pre>
                        </details>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <h3 class="error">❌ Network Error</h3>
                    <p>${error.message}</p>
                `;
            }
        }

        async function testBoth() {
            await Promise.all([testSMS(), testEmail()]);
        }
    </script>
</body>
</html>
