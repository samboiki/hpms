<!DOCTYPE html>
<html>
<head>
    <title>Network Test</title>
</head>
<body>
    <h1>Testing Network Connection</h1>
    <div id="results"></div>
    
    <script>
        const results = document.getElementById('results');
        
        // Test 1: Basic fetch to localhost
        async function testLocalhost() {
            try {
                console.log('Testing localhost:5000...');
                const response = await fetch('http://localhost:5000/');
                results.innerHTML += '<p>✅ Localhost:5000 accessible</p>';
            } catch (error) {
                console.error('Localhost error:', error);
                results.innerHTML += '<p>❌ Localhost:5000 error: ' + error.message + '</p>';
            }
        }
        
        // Test 2: Check Supabase connection
        async function testSupabase() {
            try {
                console.log('Testing Supabase connection...');
                const response = await fetch('https://jjxlfunlbyayxwvlpgwt.supabase.co/auth/v1/health');
                if (response.ok) {
                    results.innerHTML += '<p>✅ Supabase accessible</p>';
                } else {
                    results.innerHTML += '<p>⚠️ Supabase returned status: ' + response.status + '</p>';
                }
            } catch (error) {
                console.error('Supabase error:', error);
                results.innerHTML += '<p>❌ Supabase error: ' + error.message + '</p>';
            }
        }
        
        // Test 3: Check proxy server
        async function testProxy() {
            try {
                console.log('Testing proxy server...');
                const response = await fetch('http://localhost:5001/health');
                const data = await response.json();
                results.innerHTML += '<p>✅ Proxy server accessible: ' + JSON.stringify(data) + '</p>';
            } catch (error) {
                console.error('Proxy error:', error);
                results.innerHTML += '<p>❌ Proxy server error: ' + error.message + '</p>';
            }
        }
        
        // Run all tests
        testLocalhost();
        testSupabase();
        testProxy();
        
        // Check for CORS errors in console
        window.addEventListener('error', (event) => {
            console.error('Global error:', event);
        });
        
        window.addEventListener('unhandledrejection', (event) => {
            console.error('Unhandled promise rejection:', event.reason);
        });
    </script>
</body>
</html>
