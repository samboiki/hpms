<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Resend API Directly</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #f3f4f6;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        button {
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { opacity: 0.9; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        .log {
            background: #1f2937;
            color: #e5e7eb;
            padding: 20px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 20px;
            white-space: pre-wrap;
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .info { color: #3b82f6; }
        .warning { color: #f59e0b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test Resend API Directly</h1>
        <p>This tests the Resend API directly without going through Supabase edge functions.</p>
        
        <div>
            <button onclick="testSimpleEmail()">Test Simple Email</button>
            <button onclick="testWithOnboardingEmail()">Test with onboarding@resend.dev</button>
            <button onclick="testToYourEmail()">Test to ksnahol@gmail.com</button>
            <button onclick="clearLogs()">Clear Logs</button>
        </div>
        
        <div id="log" class="log"></div>
    </div>

    <script>
        const RESEND_API_KEY = 're_bcMNuZ8E_3Q7gBRbFPJacTJFXYwaW4Fz6';
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `<div class="${type}">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function clearLogs() {
            document.getElementById('log').innerHTML = '';
            log('Logs cleared');
        }

        async function testSimpleEmail() {
            log('📧 Testing simple email...');
            
            try {
                const emailData = {
                    from: 'onboarding@resend.dev',
                    to: 'ksnahol@gmail.com',
                    subject: 'Test Email from HPMS',
                    text: 'This is a test email from HPMS to verify Resend API is working.',
                    html: '<p>This is a test email from HPMS to verify Resend API is working.</p>'
                };

                log(`Request data: ${JSON.stringify(emailData, null, 2)}`);

                const response = await fetch('https://api.resend.com/emails', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${RESEND_API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(emailData)
                });

                const responseText = await response.text();
                log(`Response status: ${response.status} ${response.statusText}`);
                log(`Response: ${responseText}`);

                if (response.ok) {
                    const result = JSON.parse(responseText);
                    log(`✅ Email sent successfully! ID: ${result.id}`, 'success');
                } else {
                    log(`❌ Failed to send email`, 'error');
                    const error = JSON.parse(responseText);
                    log(`Error: ${error.message || error.error || 'Unknown error'}`, 'error');
                }

            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        async function testWithOnboardingEmail() {
            log('📧 Testing with onboarding@resend.dev...');
            
            try {
                const emailData = {
                    from: 'onboarding@resend.dev',
                    to: 'ksnahol@gmail.com',
                    subject: 'Test from Onboarding',
                    text: 'Testing with the default onboarding email address.'
                };

                const response = await fetch('https://api.resend.com/emails', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${RESEND_API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(emailData)
                });

                const result = await response.json();
                log(`Response: ${JSON.stringify(result, null, 2)}`);

                if (response.ok) {
                    log(`✅ Success! Message ID: ${result.id}`, 'success');
                } else {
                    log(`❌ Failed: ${result.message || result.error}`, 'error');
                }

            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        async function testToYourEmail() {
            log('📧 Testing specifically to ksnahol@gmail.com...');
            
            try {
                // Test with minimal data
                const emailData = {
                    from: 'onboarding@resend.dev',
                    to: 'ksnahol@gmail.com',
                    subject: 'HPMS Test',
                    text: 'Test'
                };

                log(`Sending to: ${emailData.to}`);
                log(`From: ${emailData.from}`);

                const response = await fetch('https://api.resend.com/emails', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${RESEND_API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(emailData)
                });

                const responseText = await response.text();
                log(`Response: ${responseText}`);

                if (response.ok) {
                    log(`✅ Email sent!`, 'success');
                } else {
                    log(`❌ Failed with status ${response.status}`, 'error');
                }

            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        window.onload = () => {
            log('🧪 Resend API Direct Test Ready');
            log('ℹ️ This bypasses Supabase and tests Resend directly', 'info');
            log('⚠️ Using API key: re_bcMNuZ8E_...', 'warning');
        };
    </script>
</body>
</html>
