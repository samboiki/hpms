<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Supabase Auth</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #f3f4f6;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            opacity: 0.9;
        }
        .log {
            background: #1f2937;
            color: #e5e7eb;
            padding: 20px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 20px;
            white-space: pre-wrap;
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Test Supabase Authentication</h1>
        
        <button onclick="testAuth()">Test Authentication</button>
        
        <div id="log" class="log"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jjxlfunlbyayxwvlpgwt.supabase.co';
        const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0';
        
        function log(message, type = '') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `<div class="${type}">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function testAuth() {
            log('Starting authentication tests...\n');
            
            // Get auth from localStorage
            const authData = localStorage.getItem('hpms-auth');
            if (!authData) {
                log('❌ No auth data found in localStorage', 'error');
                return;
            }
            
            const { access_token, user } = JSON.parse(authData);
            log(`✅ Found auth token for user: ${user.email}`, 'success');
            log(`Token length: ${access_token.length}`);
            
            // Test 1: Simple auth check
            log('\n📝 Test 1: Auth check with automation_executions...');
            try {
                const response = await fetch(
                    `${SUPABASE_URL}/rest/v1/automation_executions?limit=1`,
                    {
                        headers: {
                            'Authorization': `Bearer ${access_token}`,
                            'apikey': ANON_KEY
                        }
                    }
                );
                
                log(`Response status: ${response.status} ${response.statusText}`);
                
                if (response.ok) {
                    const data = await response.json();
                    log(`✅ Success! Found ${data.length} records`, 'success');
                } else {
                    const error = await response.text();
                    log(`❌ Error: ${error}`, 'error');
                }
            } catch (error) {
                log(`❌ Exception: ${error.message}`, 'error');
            }
            
            // Test 2: Check specific execution
            log('\n📝 Test 2: Check Happy Joy\'s execution...');
            try {
                const response = await fetch(
                    `${SUPABASE_URL}/rest/v1/automation_executions?id=eq.c1e40a7e-495d-4ed5-9bea-c4725b0ea6fc`,
                    {
                        headers: {
                            'Authorization': `Bearer ${access_token}`,
                            'apikey': ANON_KEY,
                            'Content-Type': 'application/json'
                        }
                    }
                );
                
                log(`Response status: ${response.status} ${response.statusText}`);
                
                if (response.ok) {
                    const data = await response.json();
                    if (data.length > 0) {
                        log(`✅ Found execution:`, 'success');
                        log(`   Status: ${data[0].status}`);
                        log(`   Patient ID: ${data[0].patient_id}`);
                    } else {
                        log('❌ No execution found with that ID', 'error');
                    }
                } else {
                    const error = await response.text();
                    log(`❌ Error: ${error}`, 'error');
                }
            } catch (error) {
                log(`❌ Exception: ${error.message}`, 'error');
            }
            
            // Test 3: Edge function call
            log('\n📝 Test 3: Call automation-engine edge function...');
            try {
                const response = await fetch(
                    `${SUPABASE_URL}/functions/v1/automation-engine`,
                    {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${access_token}`,
                            'apikey': ANON_KEY,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            executionId: 'c1e40a7e-495d-4ed5-9bea-c4725b0ea6fc'
                        })
                    }
                );
                
                log(`Response status: ${response.status} ${response.statusText}`);
                
                const result = await response.json();
                log(`Result: ${JSON.stringify(result, null, 2)}`);
            } catch (error) {
                log(`❌ Exception: ${error.message}`, 'error');
            }
        }
    </script>
</body>
</html>
