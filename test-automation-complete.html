<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Complete Automation System</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f3f4f6;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 20px;
        }
        button {
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { opacity: 0.9; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        .log {
            background: #1f2937;
            color: #e5e7eb;
            padding: 20px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 20px;
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .info { color: #3b82f6; }
        .warning { color: #f59e0b; }
        .section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
        }
        h3 { margin-top: 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 HPMS Automation System Test Suite</h1>
        
        <div class="section">
            <h3>🔧 System Status Check</h3>
            <button onclick="checkSystem()">Check System Status</button>
            <button onclick="checkAutomationSettings()">Check Automation Settings</button>
            <button onclick="checkTemplates()">Check Templates</button>
        </div>

        <div class="section">
            <h3>👤 Create Test Patient</h3>
            <input type="text" id="firstName" placeholder="First Name" value="Test">
            <input type="text" id="lastName" placeholder="Last Name" value="Patient">
            <input type="email" id="email" placeholder="Email" value="ksnahol@gmail.com">
            <input type="tel" id="phone" placeholder="Phone" value="0812222331">
            <button onclick="createPatient()">Create Patient</button>
        </div>

        <div class="section">
            <h3>📨 Test Specific Automation</h3>
            <select id="patientSelect">
                <option value="">Select a patient...</option>
            </select>
            <button onclick="loadPatients()">Load Recent Patients</button>
            <button onclick="sendWelcomeEmail()">Send Welcome Email</button>
            <button onclick="sendWelcomeSMS()">Send Welcome SMS</button>
        </div>

        <div class="section">
            <h3>🔄 Process Automations</h3>
            <button onclick="processAllPending()">Process All Pending</button>
            <button onclick="checkQueue()">Check Automation Queue</button>
        </div>

        <div id="log" class="log"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jjxlfunlbyayxwvlpgwt.supabase.co';
        const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpqeGxmdW5sYnlheXh3dmxwZ3d0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDcwNjE2ODksImV4cCI6MjA2MjYzNzY4OX0.TCNww59ZpJ00QhZgld4QJkYCHz53GAtyjw4F5hptFAM';
        const PRACTICE_ID = 'b64632c2-3a56-44cf-a2c9-0e42be03a2d3';
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `<div class="${type}">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function getAuthHeaders() {
            const authData = localStorage.getItem('hpms-auth');
            if (!authData) {
                throw new Error('Not authenticated');
            }
            const { access_token } = JSON.parse(authData);
            return {
                'Authorization': `Bearer ${access_token}`,
                'apikey': access_token,
                'Content-Type': 'application/json',
                'Prefer': 'return=representation'
            };
        }

        async function checkSystem() {
            try {
                const headers = await getAuthHeaders();
                log('🔍 Checking system status...');
                
                // Check automation settings
                const settingsRes = await fetch(
                    `${SUPABASE_URL}/rest/v1/automation_settings?practice_id=eq.${PRACTICE_ID}&automation_id=eq.welcome-new-patient`,
                    { headers }
                );
                const settings = await settingsRes.json();
                
                if (settings.length > 0) {
                    const setting = settings[0];
                    log(`✅ Welcome automation is ${setting.is_active ? 'ACTIVE' : 'INACTIVE'}`, setting.is_active ? 'success' : 'warning');
                    log(`Channels: ${JSON.stringify(setting.channels)}`);
                    log(`SMS Template ID: ${setting.sms_template_id || 'Using inline template'}`);
                    log(`Email Template ID: ${setting.email_template_id || 'Using inline template'}`);
                } else {
                    log('❌ Welcome automation not found!', 'error');
                }
                
                // Check subscriptions
                const smsSubRes = await fetch(
                    `${SUPABASE_URL}/rest/v1/practice_sms_subscriptions?practice_id=eq.${PRACTICE_ID}&is_active=eq.true`,
                    { headers }
                );
                const smsSub = await smsSubRes.json();
                
                if (smsSub.length > 0) {
                    log(`✅ SMS Subscription Active: ${smsSub[0].current_usage}/${smsSub[0].monthly_limit} used`, 'success');
                } else {
                    log('❌ No active SMS subscription!', 'error');
                }
                
                const emailSubRes = await fetch(
                    `${SUPABASE_URL}/rest/v1/practice_email_subscriptions?practice_id=eq.${PRACTICE_ID}&is_active=eq.true`,
                    { headers }
                );
                const emailSub = await emailSubRes.json();
                
                if (emailSub.length > 0) {
                    log(`✅ Email Subscription Active: ${emailSub[0].current_usage}/${emailSub[0].monthly_limit} used`, 'success');
                } else {
                    log('❌ No active email subscription!', 'error');
                }
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        async function checkAutomationSettings() {
            try {
                const headers = await getAuthHeaders();
                log('📋 Checking all automation settings...');
                
                const res = await fetch(
                    `${SUPABASE_URL}/rest/v1/automation_settings?practice_id=eq.${PRACTICE_ID}`,
                    { headers }
                );
                const settings = await res.json();
                
                const settingsArray = Array.isArray(settings) ? settings : [];
                settingsArray.forEach(setting => {
                    log(`\n📌 ${setting.name} (${setting.automation_id})`);
                    log(`   Active: ${setting.is_active ? '✅' : '❌'}`);
                    log(`   Channels: ${setting.channels.map(c => c.enabled ? c.type : '').filter(Boolean).join(', ')}`);
                    log(`   SMS Template: ${setting.sms_template_id ? `ID: ${setting.sms_template_id}` : 'Inline'}`);
                    log(`   Email Template: ${setting.email_template_id ? `ID: ${setting.email_template_id}` : 'Inline'}`);
                });
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        async function checkTemplates() {
            try {
                const headers = await getAuthHeaders();
                log('📄 Checking message templates...');
                
                const res = await fetch(
                    `${SUPABASE_URL}/rest/v1/message_templates?practice_id=eq.${PRACTICE_ID}&is_active=eq.true`,
                    { headers }
                );
                const templates = await res.json();
                
                const templatesArray = Array.isArray(templates) ? templates : [];
                const emailTemplates = templatesArray.filter(t => t.type === 'email');
                const smsTemplates = templatesArray.filter(t => t.type === 'sms');
                
                log(`\n📧 Email Templates (${emailTemplates.length}):`);
                emailTemplates.forEach(t => {
                    log(`   - ${t.name} (${t.template_type})`);
                });
                
                log(`\n📱 SMS Templates (${smsTemplates.length}):`);
                smsTemplates.forEach(t => {
                    log(`   - ${t.name} (${t.template_type})`);
                });
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        async function createPatient() {
            try {
                const headers = await getAuthHeaders();
                const firstName = document.getElementById('firstName').value;
                const lastName = document.getElementById('lastName').value;
                const email = document.getElementById('email').value;
                const phone = document.getElementById('phone').value;
                
                log(`👤 Creating patient: ${firstName} ${lastName}...`);
                
                const res = await fetch(
                    `${SUPABASE_URL}/rest/v1/patients`,
                    {
                        method: 'POST',
                        headers,
                        body: JSON.stringify({
                            practice_id: PRACTICE_ID,
                            first_name: firstName,
                            last_name: lastName,
                            email: email,
                            cell_number: phone,
                            date_of_birth: '2010-01-01',
                            gender: 'male',
                            created_by: '00dd5a75-fd97-448b-8e66-e192400f49f2'
                        })
                    }
                );
                
                if (res.ok) {
                    const patients = await res.json();
                    if (patients.length > 0) {
                        log(`✅ Patient created: ID ${patients[0].id}`, 'success');
                        log('⏳ Waiting for automation to trigger...');
                        
                        // Check for automation after 3 seconds
                        setTimeout(() => checkPatientAutomation(patients[0].id), 3000);
                    }
                } else {
                    const error = await res.text();
                    log(`❌ Failed to create patient: ${error}`, 'error');
                }
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        async function checkPatientAutomation(patientId) {
            try {
                const headers = await getAuthHeaders();
                
                const res = await fetch(
                    `${SUPABASE_URL}/rest/v1/automation_executions?patient_id=eq.${patientId}`,
                    { headers }
                );
                const executions = await res.json();
                
                if (executions.length > 0) {
                    log(`✅ Automation created for patient!`, 'success');
                    executions.forEach(exec => {
                        log(`   ID: ${exec.id}`);
                        log(`   Status: ${exec.status}`);
                        log(`   Template Data: ${JSON.stringify(exec.template_data)}`);
                    });
                } else {
                    log('⚠️ No automation created yet', 'warning');
                }
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        async function loadPatients() {
            try {
                const headers = await getAuthHeaders();
                log('Loading recent patients...');
                
                const res = await fetch(
                    `${SUPABASE_URL}/rest/v1/patients?practice_id=eq.${PRACTICE_ID}&order=created_at.desc&limit=10`,
                    { headers }
                );
                const patients = await res.json();
                
                const select = document.getElementById('patientSelect');
                select.innerHTML = '<option value="">Select a patient...</option>';
                
                const patientsArray = Array.isArray(patients) ? patients : [];
                patientsArray.forEach(patient => {
                    const option = document.createElement('option');
                    option.value = patient.id;
                    option.textContent = `${patient.first_name} ${patient.last_name} (${patient.email})`;
                    select.appendChild(option);
                });
                
                log(`✅ Loaded ${patientsArray.length} patients`, 'success');
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        async function sendWelcomeEmail() {
            try {
                const headers = await getAuthHeaders();
                const patientId = document.getElementById('patientSelect').value;
                
                if (!patientId) {
                    log('⚠️ Please select a patient first', 'warning');
                    return;
                }
                
                log('📧 Sending welcome email...');
                
                // Get patient details
                const patientRes = await fetch(
                    `${SUPABASE_URL}/rest/v1/patients?id=eq.${patientId}`,
                    { headers }
                );
                const patients = await patientRes.json();
                const patient = patients[0];
                
                // Send email directly
                const res = await fetch(`${SUPABASE_URL}/functions/v1/centralized-email-gateway`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': headers['Authorization'],
                        'apikey': ANON_KEY
                    },
                    body: JSON.stringify({
                        practiceId: PRACTICE_ID,
                        recipientEmail: patient.email,
                        recipientName: `${patient.first_name} ${patient.last_name}`,
                        subject: 'Welcome to New Charm Dental Practice!',
                        textContent: `Dear ${patient.first_name} ${patient.last_name},

Welcome to New Charm Dental Practice! We are thrilled to have you as our patient.

As a new patient, you can:
- Schedule appointments online
- Access your medical records
- Message your healthcare team
- View test results

If you have any questions, please contact us at +264 81 435 8843.

Best regards,
The New Charm Dental Practice Team`,
                        emailType: 'welcome',
                        patientId: patientId
                    })
                });
                
                const result = await res.json();
                
                if (result.success) {
                    log('✅ Email sent successfully!', 'success');
                    log(`Message ID: ${result.messageId}`);
                } else {
                    log(`❌ Failed: ${result.error}`, 'error');
                }
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        async function sendWelcomeSMS() {
            try {
                const headers = await getAuthHeaders();
                const patientId = document.getElementById('patientSelect').value;
                
                if (!patientId) {
                    log('⚠️ Please select a patient first', 'warning');
                    return;
                }
                
                log('📱 Sending welcome SMS...');
                
                // Get patient details
                const patientRes = await fetch(
                    `${SUPABASE_URL}/rest/v1/patients?id=eq.${patientId}`,
                    { headers }
                );
                const patients = await patientRes.json();
                const patient = patients[0];
                
                // Send SMS directly
                const res = await fetch(`${SUPABASE_URL}/functions/v1/centralized-sms-gateway`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': headers['Authorization'],
                        'apikey': ANON_KEY
                    },
                    body: JSON.stringify({
                        practiceId: PRACTICE_ID,
                        recipientPhone: patient.cell_number,
                        messageContent: `Hi ${patient.first_name}, welcome to New Charm Dental Practice! We are excited to have you as a new patient. If you have any questions, please call us at +264 81 435 8843.`,
                        messageType: 'welcome',
                        patientId: patientId
                    })
                });
                
                const result = await res.json();
                
                if (result.success) {
                    log('✅ SMS sent successfully!', 'success');
                    log(`Log ID: ${result.logId}`);
                } else {
                    log(`❌ Failed: ${result.error}`, 'error');
                }
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        async function processAllPending() {
            try {
                const headers = await getAuthHeaders();
                log('🔄 Processing all pending automations...');
                
                const res = await fetch(`${SUPABASE_URL}/functions/v1/automation-engine`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': headers['Authorization'],
                        'apikey': ANON_KEY
                    },
                    body: JSON.stringify({})
                });
                
                const result = await res.json();
                
                if (result.success) {
                    log(`✅ Processed ${result.processed} automations`, 'success');
                    
                    if (result.results && result.results.length > 0) {
                        result.results.forEach((res, idx) => {
                            log(`\nAutomation ${idx + 1}:`);
                            if (res.sms) {
                                log(`  📱 SMS: ${res.sms.success ? '✅ Sent' : '❌ ' + res.sms.error}`);
                            }
                            if (res.email) {
                                log(`  📧 Email: ${res.email.success ? '✅ Sent' : '❌ ' + res.email.error}`);
                            }
                        });
                    }
                } else {
                    log(`❌ Failed: ${result.error}`, 'error');
                }
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        async function checkQueue() {
            try {
                const headers = await getAuthHeaders();
                log('📋 Checking automation queue...');
                
                const res = await fetch(
                    `${SUPABASE_URL}/rest/v1/automation_queue?practice_id=eq.${PRACTICE_ID}&order=created_at.desc&limit=10`,
                    { headers }
                );
                const queue = await res.json();
                
                const queueArray = Array.isArray(queue) ? queue : [];
                log(`Found ${queueArray.length} items in queue:`);
                queueArray.forEach(item => {
                    log(`\n📌 Queue ID: ${item.id}`);
                    log(`   Status: ${item.status}`);
                    log(`   Execution ID: ${item.execution_id}`);
                    log(`   Scheduled: ${new Date(item.scheduled_for).toLocaleString()}`);
                    if (item.error_message) {
                        log(`   Error: ${item.error_message}`, 'error');
                    }
                });
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        window.onload = () => {
            log('🚀 HPMS Automation Test Suite Ready');
            log('Make sure you are logged into HPMS first!');
        };
    </script>
</body>
</html>
