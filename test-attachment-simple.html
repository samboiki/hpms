<!DOCTYPE html>
<html>
<head>
    <title>Simple Attachment Test</title>
</head>
<body>
    <h1>Simple Attachment Test</h1>
    
    <input type="file" id="fileInput" accept=".txt,.pdf,.jpg,.png">
    <button onclick="testAttachment()">Test Attachment</button>
    
    <div id="result"></div>

    <script>
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => {
                    const result = reader.result;
                    const base64 = result.split(',')[1];
                    resolve(base64);
                };
                reader.onerror = error => reject(error);
            });
        }

        async function testAttachment() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Please select a file first');
                return;
            }
            
            console.log('Selected file:', file.name, file.size, file.type);
            
            try {
                const base64Content = await fileToBase64(file);
                console.log('Base64 length:', base64Content.length);
                
                const attachment = {
                    filename: file.name,
                    content: base64Content,
                    type: file.type || 'application/octet-stream'
                };
                
                console.log('Attachment object:', attachment);
                
                // Test the actual communication service flow
                const testEmailRequest = {
                    practiceId: "5da3896d-b9f3-4b0a-996a-3adca867cb30",
                    recipientEmail: "ksnahol@gmail.com",
                    recipientName: "Test User",
                    subject: "Direct Test Email with Attachment",
                    textContent: "This is a test email with attachment.",
                    emailType: "test",
                    attachments: [attachment]
                };
                
                console.log('Sending email request:', testEmailRequest);
                
                // Call the edge function directly
                const response = await fetch('https://jjxlfunlbyayxwvlpgwt.supabase.co/functions/v1/centralized-email-gateway', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(testEmailRequest)
                });
                
                const result = await response.json();
                console.log('Response:', result);
                
                document.getElementById('result').innerHTML = `
                    <h3>Result:</h3>
                    <pre>${JSON.stringify(result, null, 2)}</pre>
                `;
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('result').innerHTML = `
                    <h3>Error:</h3>
                    <pre>${error.message}</pre>
                `;
            }
        }
    </script>
</body>
</html>
