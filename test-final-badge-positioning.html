<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Final Badge Positioning Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes ping {
      75%, 100% {
        transform: scale(2);
        opacity: 0;
      }
    }
    .animate-ping {
      animation: ping 1s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
  </style>
</head>
<body class="bg-gray-100 p-8">
  <div class="max-w-5xl mx-auto space-y-8">
    <h1 class="text-2xl font-bold mb-6">Final Badge Positioning - As Requested</h1>
    
    <!-- Sidebar Example -->
    <div class="bg-white p-6 rounded-lg shadow">
      <h2 class="text-lg font-semibold mb-4">1. Sidebar - Badge on Right Side</h2>
      <div class="space-y-2">
        <!-- Messages with badge -->
        <a class="flex items-center px-4 py-3 rounded-xl transition-all duration-200 min-h-[48px] group hover:bg-gray-100 bg-gray-50 shadow-sm border border-gray-200" href="/communications">
          <svg class="w-5 h-5 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
          <span class="ml-3 text-sm font-medium flex-1">Messages</span>
          <!-- Badge positioned on the right -->
          <div class="bg-gradient-to-r from-red-500 to-red-600 text-white text-[10px] font-bold rounded-full min-w-[20px] h-[20px] flex items-center justify-center px-1.5 shadow-md border-2 border-white">
            5
          </div>
        </a>
        
        <!-- Patients without badge -->
        <a class="flex items-center px-4 py-3 rounded-xl transition-all duration-200 min-h-[48px] group hover:bg-gray-100" href="/patients">
          <svg class="w-5 h-5 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg>
          <span class="ml-3 text-sm font-medium">Patients</span>
        </a>
      </div>
    </div>
    
    <!-- Tab Example -->
    <div class="bg-white p-6 rounded-lg shadow">
      <h2 class="text-lg font-semibold mb-4">2. Communications Tab - Badge in Corner</h2>
      <div class="flex gap-2">
        <!-- Active tab with badge -->
        <button class="relative flex flex-col sm:flex-row items-center justify-center gap-1 sm:gap-2 px-4 py-3 text-sm font-medium transition-all duration-200 capitalize min-h-[60px] bg-gradient-to-r from-amber-500 to-orange-600 text-white shadow-lg rounded-lg">
          <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
          </svg>
          <span class="truncate">Messaging</span>
          <!-- Badge in top-right corner -->
          <div class="absolute top-2 right-2 bg-gradient-to-r from-red-500 to-red-600 text-white text-[10px] font-bold rounded-full min-w-[20px] h-[20px] flex items-center justify-center px-1.5 shadow-md border-2 border-white">
            12
          </div>
        </button>
        
        <!-- Inactive tab -->
        <button class="relative flex flex-col sm:flex-row items-center justify-center gap-1 sm:gap-2 px-4 py-3 text-sm font-medium transition-all duration-200 capitalize min-h-[60px] text-gray-600 hover:text-gray-900 hover:bg-gray-50 rounded-lg">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
          </svg>
          <span class="truncate">Dashboard</span>
        </button>
      </div>
    </div>
    
    <!-- Floating Button Example -->
    <div class="bg-white p-6 rounded-lg shadow">
      <h2 class="text-lg font-semibold mb-4">3. Floating Visit Tracker - Badge Outside Button</h2>
      <div class="relative inline-block">
        <!-- Container div -->
        <div class="relative">
          <!-- Button -->
          <button class="relative w-20 h-20 bg-white rounded-full shadow-2xl border-2 border-gray-200">
            <svg class="absolute inset-1 w-[72px] h-[72px]" viewBox="0 0 72 72">
              <circle cx="36" cy="36" r="30" fill="none" stroke="#D1D5DB" stroke-width="6"></circle>
              <circle cx="36" cy="36" r="30" fill="none" stroke="#6B7280" stroke-width="6" stroke-linecap="round" style="stroke-dasharray: 94.2478, 188.496; stroke-dashoffset: 0;"></circle>
            </svg>
            <div class="absolute inset-0 flex items-center justify-center">
              <div class="text-center">
                <p class="text-2xl font-bold text-gray-800">8</p>
                <p class="text-xs text-gray-500 -mt-1">Visits</p>
              </div>
            </div>
          </button>
          
          <!-- Badge positioned outside the button -->
          <div class="absolute -top-1 -right-1">
            <div class="relative">
              <div class="absolute inset-0 bg-red-500 rounded-full animate-ping opacity-75"></div>
              <div class="relative bg-gradient-to-r from-red-500 to-red-600 text-white text-xs font-bold rounded-full min-w-[24px] h-[24px] flex items-center justify-center px-1.5 shadow-lg">
                3
              </div>
            </div>
          </div>
        </div>
      </div>
      <p class="text-sm text-gray-600 mt-4">Badge is now outside the button, no clipping!</p>
    </div>
    
    <!-- Channel List Example -->
    <div class="bg-white p-6 rounded-lg shadow">
      <h2 class="text-lg font-semibold mb-4">4. Channel List - Inline Badges</h2>
      <div class="space-y-2">
        <button class="w-full text-left p-4 border-b border-gray-100 hover:bg-gray-50 transition-colors">
          <div class="flex items-center justify-between">
            <div class="flex-1">
              <h4 class="font-medium text-gray-900">Team Chat</h4>
              <div class="mt-1 flex items-baseline gap-1">
                <span class="text-[11px] font-semibold text-gray-700">John:</span>
                <p class="text-[11px] text-gray-600 truncate flex-1">Hey everyone, meeting at 3pm!</p>
                <span class="text-[10px] text-gray-400 whitespace-nowrap ml-1">14:32</span>
              </div>
            </div>
            <!-- Badge on the right -->
            <div class="ml-2 bg-gradient-to-r from-red-500 to-red-600 text-white text-[10px] font-bold rounded-full min-w-[20px] h-[20px] flex items-center justify-center px-1.5 shadow-md">
              3
            </div>
          </div>
        </button>
        
        <button class="w-full text-left p-4 border-b border-gray-100 hover:bg-gray-50 transition-colors">
          <div class="flex items-center justify-between">
            <div class="flex-1">
              <h4 class="font-medium text-gray-900">Dr. Smith</h4>
              <div class="mt-1 flex items-baseline gap-1">
                <span class="text-[11px] font-semibold text-gray-700">You:</span>
                <p class="text-[11px] text-gray-600 truncate flex-1">Thanks for the update</p>
                <span class="text-[10px] text-gray-400 whitespace-nowrap ml-1">13:45</span>
              </div>
            </div>
            <!-- No badge when read -->
          </div>
        </button>
      </div>
    </div>
  </div>
</body>
</html>
