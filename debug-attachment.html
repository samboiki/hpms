<!DOCTYPE html>
<html>
<head>
    <title>Debug Email Attachment</title>
</head>
<body>
    <h1>Debug Email Attachment</h1>
    
    <form id="testForm">
        <label>
            Email:
            <input type="email" id="email" value="ksnahol@gmail.com" required>
        </label>
        <br><br>
        
        <label>
            Subject:
            <input type="text" id="subject" value="Test Email with Attachment" required>
        </label>
        <br><br>
        
        <label>
            Message:
            <textarea id="message" required>This is a test email with attachment from debug script.</textarea>
        </label>
        <br><br>
        
        <label>
            Attachment:
            <input type="file" id="attachment" accept=".pdf,.doc,.docx,.txt,.jpg,.jpeg,.png">
        </label>
        <br><br>
        
        <button type="submit">Send Test Email</button>
    </form>

    <div id="result"></div>

    <script>
        // Convert File to base64
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => {
                    const result = reader.result;
                    const base64 = result.split(',')[1]; // Extract base64 part from data URL
                    resolve(base64);
                };
                reader.onerror = error => reject(error);
            });
        }

        document.getElementById('testForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const subject = document.getElementById('subject').value;
            const message = document.getElementById('message').value;
            const attachmentFile = document.getElementById('attachment').files[0];
            
            let attachments = [];
            
            if (attachmentFile) {
                console.log('Processing attachment:', attachmentFile.name, attachmentFile.size, attachmentFile.type);
                
                try {
                    const base64Content = await fileToBase64(attachmentFile);
                    attachments = [{
                        filename: attachmentFile.name,
                        content: base64Content,
                        type: attachmentFile.type || 'application/octet-stream'
                    }];
                    console.log('Attachment processed:', attachments[0]);
                } catch (error) {
                    console.error('Error processing attachment:', error);
                    alert('Error processing attachment: ' + error.message);
                    return;
                }
            }
            
            const emailData = {
                practiceId: '57e0b2e5-8b47-4a16-9b37-b3b0f3b0b0b0', // Replace with actual practice ID
                recipientEmail: email,
                recipientName: 'Test User',
                subject: subject,
                textContent: message,
                emailType: 'test',
                attachments: attachments
            };
            
            console.log('Sending email with data:', emailData);
            
            try {
                const response = await fetch('https://jjxlfunlbyayxwvlpgwt.supabase.co/functions/v1/centralized-email-gateway', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + 'YOUR_ACCESS_TOKEN', // Replace with actual token
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(emailData)
                });
                
                const result = await response.json();
                console.log('Email result:', result);
                
                document.getElementById('result').innerHTML = `
                    <h3>Result:</h3>
                    <pre>${JSON.stringify(result, null, 2)}</pre>
                `;
                
                if (result.success) {
                    alert('Email sent successfully!');
                } else {
                    alert('Email failed: ' + result.error);
                }
            } catch (error) {
                console.error('Error sending email:', error);
                alert('Error sending email: ' + error.message);
            }
        });
    </script>
</body>
</html>
