<!DOCTYPE html>
<html>
<head>
    <title>Test Email Send</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        pre { background: #f0f0f0; padding: 10px; overflow-x: auto; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 10px 0; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Test Email Send</h1>
    <p>Click the button below to send a test email to ksnahol@gmail.com</p>
    <button onclick="testEmail()">Send Test Email</button>
    <div id="result"></div>

    <script>
        async function testEmail() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Sending Email...</p>';
            
            try {
                const response = await fetch('https://jjxlfunlbyayxwvlpgwt.supabase.co/functions/v1/centralized-email-gateway', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-application-name': 'hpms-test'
                    },
                    body: JSON.stringify({
                        practiceId: '5da3896d-b9f3-4b0a-996a-3adca867cb30',
                        recipientEmail: 'ksnahol@gmail.com',
                        recipientName: 'Test User',
                        subject: 'Test Email from HPMS',
                        htmlContent: `
                            <h2>Test Email from HPMS Centralized Gateway</h2>
                            <p>This is a test email sent via the centralized email gateway.</p>
                            <p><strong>Time:</strong> ${new Date().toLocaleString()}</p>
                            <p>If you received this email, the centralized email gateway is working correctly!</p>
                            <hr>
                            <p style="color: #666; font-size: 12px;">
                                This is an automated test email from HPMS Healthcare Practice Management System.
                            </p>
                        `,
                        textContent: 'Test Email from HPMS Centralized Gateway\n\nThis is a test email sent via the centralized email gateway.\n\nTime: ' + new Date().toLocaleString() + '\n\nIf you received this email, the centralized email gateway is working correctly!',
                        emailType: 'test',
                        metadata: {
                            test: true,
                            timestamp: new Date().toISOString()
                        }
                    })
                });
                
                const result = await response.json();
                
                if (response.ok && result.success) {
                    resultDiv.innerHTML = `
                        <h3 class="success">✅ Email Sent Successfully!</h3>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <h3 class="error">❌ Email Send Failed</h3>
                        <p>Status: ${response.status}</p>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <h3 class="error">❌ Error</h3>
                    <p>${error.message}</p>
                `;
            }
        }
    </script>
</body>
</html>
