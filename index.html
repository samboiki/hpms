<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48x48.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- PWA and Mobile Full Screen Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- "default" keeps the app below the iPhone status bar; "black-translucent" drew the header under the clock -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="OneHealth">
    <meta name="apple-touch-fullscreen" content="yes">
    <!-- White like the app bar (and the store apps' status bar, capacitor.config.ts); the app icon stays teal -->
    <meta name="theme-color" content="#ffffff">

    <title>OneHealth</title>
    <!-- Google Fonts: Rubik and Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      /* Ensure gray background persists */
      html, body {
        background-color: #f3f4f6 !important; /* gray-100 */
        min-height: 100vh;
        /* The signed-in app fills the screen exactly (Layout is 100dvh). 100vh is the screen height with the browser's toolbar
           tucked away, so wherever the toolbar stays (a link opened from WhatsApp, an installed app) the page was one toolbar
           taller than the screen and could be scrolled up under it, taking the app bar and its menu button out of sight
           (owner's phone, 15 Oct 2026). Browsers without dvh keep the line above. */
        min-height: 100dvh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
