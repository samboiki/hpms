<!DOCTYPE html>
<html>
<head>
    <title>Mobile Layout Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, sans-serif; }
    </style>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-sm mx-auto bg-white rounded-lg shadow-lg p-4">
        <h2 class="text-lg font-bold mb-4">Mobile Calendar Controls Test</h2>
        
        <!-- Mobile Layout - Stacked rows for better spacing -->
        <div class="space-y-3">
            <!-- First Row: Grid/Timeline + Today Button -->
            <div class="flex items-center justify-between">
                <div class="flex items-center bg-white/30 backdrop-blur-sm rounded-lg p-1 shadow-sm border border-gray-200">
                    <button class="px-3 py-2 text-sm font-medium rounded-md transition-colors flex items-center gap-2 bg-gradient-to-r from-gray-600 to-gray-700 text-white shadow-md">
                        <span>⚏</span>
                        <span class="hidden sm:inline">Grid</span>
                    </button>
                    <button class="px-3 py-2 text-sm font-medium rounded-md transition-colors flex items-center gap-2 text-gray-600 hover:text-gray-900 hover:bg-white/50">
                        <span>📅</span>
                        <span class="hidden sm:inline">Timeline</span>
                    </button>
                </div>
                
                <button class="px-3 py-2 bg-gradient-to-r from-blue-500 to-blue-600 text-white rounded-xl flex items-center gap-2 hover:shadow-lg transition-colors duration-200 font-medium text-sm">
                    <span>📍</span>
                    <span class="hidden sm:inline">Today</span>
                </button>
            </div>

            <!-- Second Row: Calendar Navigation (centered) -->
            <div class="flex items-center justify-center gap-3">
                <button class="p-2 hover:bg-gray-100 rounded-full transition-colors duration-200">
                    <span class="text-gray-600">←</span>
                </button>
                <button class="text-lg font-bold text-gray-700 min-w-[140px] text-center hover:bg-gray-100 rounded-lg px-2 py-1 transition-colors duration-200 flex items-center justify-center gap-2">
                    <span>July 2025</span>
                    <span class="text-sm">📅</span>
                </button>
                <button class="p-2 hover:bg-gray-100 rounded-full transition-colors duration-200">
                    <span class="text-gray-600">→</span>
                </button>
            </div>
        </div>
        
        <div class="mt-4 text-xs text-gray-500">
            ✅ Grid/Timeline buttons on first row<br>
            ✅ Today button on right of first row<br>
            ✅ Calendar navigation centered on second row<br>
            ✅ Proper spacing with space-y-3<br>
            ✅ No cramped 3-column grid
        </div>
    </div>
</body>
</html>
