<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check & Reset Automation</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #f3f4f6;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        button {
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            opacity: 0.9;
        }
        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
        .log {
            background: #1f2937;
            color: #e5e7eb;
            padding: 20px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 20px;
            white-space: pre-wrap;
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .info { color: #3b82f6; }
        .warning { color: #f59e0b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Check & Reset Happy Joy's Automation</h1>
        
        <p>Patient: Happy Joy (54c9df8a-257b-463c-b43d-5c2db19c000a)</p>
        
        <div>
            <button onclick="checkStatus()" id="checkBtn">Check Current Status</button>
            <button onclick="resetToPending()" id="resetBtn">Reset to Pending</button>
            <button onclick="processAutomation()" id="processBtn">Process Automation</button>
        </div>
        
        <div id="log" class="log"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jjxlfunlbyayxwvlpgwt.supabase.co';
        const EXECUTION_ID = 'c1e40a7e-495d-4ed5-9bea-c4725b0ea6fc';
        const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0';
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const className = type;
            logDiv.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function getAuthHeaders() {
            const authData = localStorage.getItem('hpms-auth');
            if (!authData) {
                throw new Error('Not authenticated');
            }
            const { access_token } = JSON.parse(authData);
            return {
                'Authorization': `Bearer ${access_token}`,
                'apikey': ANON_KEY,
                'Content-Type': 'application/json',
                'Prefer': 'return=representation'
            };
        }

        async function checkStatus() {
            const btn = document.getElementById('checkBtn');
            btn.disabled = true;
            
            try {
                const headers = await getAuthHeaders();
                log('📊 Checking automation execution status...');
                
                // Get current status
                const response = await fetch(
                    `${SUPABASE_URL}/rest/v1/automation_executions?id=eq.${EXECUTION_ID}&select=*,automation_templates(*)`,
                    { headers }
                );
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                
                if (data && data.length > 0) {
                    const execution = data[0];
                    log(`✅ Found execution:`, 'success');
                    log(`   Status: ${execution.status}`, execution.status === 'pending' ? 'warning' : 'info');
                    log(`   Patient ID: ${execution.patient_id}`);
                    log(`   Created: ${new Date(execution.created_at).toLocaleString()}`);
                    log(`   Automation: ${execution.automation_templates?.name || 'Unknown'}`);
                    log(`   Channels: ${JSON.stringify(execution.automation_templates?.channels || [])}`);
                    
                    if (execution.processed_at) {
                        log(`   Processed: ${new Date(execution.processed_at).toLocaleString()}`);
                    }
                    
                    if (execution.error_message) {
                        log(`   Error: ${execution.error_message}`, 'error');
                    }
                    
                    // Check SMS and Email logs
                    log('\n📱 Checking SMS logs...');
                    const smsResponse = await fetch(
                        `${SUPABASE_URL}/rest/v1/practice_sms_logs?automation_execution_id=eq.${EXECUTION_ID}&select=*`,
                        { headers }
                    );
                    
                    if (smsResponse.ok) {
                        const smsLogs = await smsResponse.json();
                        log(`   Found ${smsLogs.length} SMS log(s)`);
                        smsLogs.forEach(sms => {
                            log(`   SMS to ${sms.recipient_phone}: ${sms.status}`, sms.status === 'sent' ? 'success' : 'error');
                        });
                    }
                    
                    log('\n📧 Checking Email logs...');
                    const emailResponse = await fetch(
                        `${SUPABASE_URL}/rest/v1/practice_email_logs?metadata->>automation_execution_id=eq.${EXECUTION_ID}&select=*`,
                        { headers }
                    );
                    
                    if (emailResponse.ok) {
                        const emailLogs = await emailResponse.json();
                        log(`   Found ${emailLogs.length} Email log(s)`);
                        emailLogs.forEach(email => {
                            log(`   Email to ${email.recipient_email}: ${email.status}`, email.status === 'sent' ? 'success' : 'error');
                        });
                    }
                } else {
                    log('❌ Execution not found!', 'error');
                }
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            } finally {
                btn.disabled = false;
            }
        }

        async function resetToPending() {
            const btn = document.getElementById('resetBtn');
            btn.disabled = true;
            
            try {
                const headers = await getAuthHeaders();
                log('🔄 Resetting execution to pending...');
                
                const response = await fetch(
                    `${SUPABASE_URL}/rest/v1/automation_executions?id=eq.${EXECUTION_ID}`,
                    {
                        method: 'PATCH',
                        headers,
                        body: JSON.stringify({
                            status: 'pending',
                            processed_at: null,
                            error_message: null
                        })
                    }
                );
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                log('✅ Reset to pending status!', 'success');
                
                // Check status again
                await checkStatus();
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            } finally {
                btn.disabled = false;
            }
        }

        async function processAutomation() {
            const btn = document.getElementById('processBtn');
            btn.disabled = true;
            
            try {
                const headers = await getAuthHeaders();
                log('🚀 Processing automation...');
                
                const response = await fetch(`${SUPABASE_URL}/functions/v1/automation-engine`, {
                    method: 'POST',
                    headers,
                    body: JSON.stringify({
                        executionId: EXECUTION_ID
                    })
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    log('✅ Automation engine response:', 'success');
                    log(JSON.stringify(result, null, 2));
                    
                    // Check status again to see results
                    setTimeout(() => checkStatus(), 2000);
                } else {
                    log(`❌ Failed: ${result.error || 'Unknown error'}`, 'error');
                }
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            } finally {
                btn.disabled = false;
            }
        }

        window.onload = () => {
            log('Ready. Click "Check Current Status" to begin.');
        };
    </script>
</body>
</html>
